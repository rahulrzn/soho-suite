spring.application.name=backend
sohosuite.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
spring.datasource.url=jdbc:postgresql://localhost:5432/sohosuite
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
sohosuite.datasets.max-file-bytes=5242880
sohosuite.datasets.max-rows=20000
sohosuite.datasets.max-columns=100
